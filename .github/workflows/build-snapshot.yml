name: Build combined snapshot (Canale 1 + 2)

on:
  schedule:
    - cron: "58 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build snapshot
        run: python3 scripts/build_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add TUTTE_LE_POSIZIONI_ATTIVE.md
          git diff --cached --quiet || git commit -m "Update combined snapshot [skip ci]"
          git push
