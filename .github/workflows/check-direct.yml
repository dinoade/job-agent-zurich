name: Check jobs (direct company sites sweep)

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-direct
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run direct company check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/check_direct.py

      - name: Commit updated state
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update direct-check state [skip ci]"
          git push
